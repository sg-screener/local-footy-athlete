appId: com.localfootyathlete.app
name: Fresh onboarding explicitly accepts no team training
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      e2eMetroUrl: "${E2E_METRO_URL}"
      e2eLaunchPurpose: "initial-cold-launch"
- extendedWaitUntil:
    visible:
      id: onboarding-welcome-cta
    timeout: 30000
- tapOn:
    id: onboarding-welcome-cta
- assertVisible: "What should I call you?"
- tapOn: "Type your name..."
- inputText: "Fixture QA"
- tapOn: "Continue"
- tapOn: "Male"
- tapOn:
    point: "25%,40%"
- inputText: "182"
- tapOn:
    point: "75%,40%"
- inputText: "84"
- tapOn: "Continue"
- tapOn: "Inside mid"
- tapOn: "Get stronger & fitter"
- tapOn: "Continue"
- tapOn: "Pre-season.*"
- assertVisible: "Team training days"
- assertVisible:
    text: "Continue"
    enabled: false
- tapOn: "No team training"
- assertVisible:
    text: "No team training"
    selected: true
- tapOn: "Monday"
- assertVisible:
    text: "No team training"
    selected: false
- tapOn: "Monday"
- assertVisible:
    text: "Continue"
    enabled: false
- tapOn: "No team training"
- takeScreenshot: /tmp/testtruth-no-team-selected
- tapOn: "Continue"
- assertVisible: "How many days each week can you get to a gym?"
- back
- assertVisible: "Team training days"
- assertVisible:
    text: "No team training"
    selected: true
- tapOn: "Continue"
- assertVisible: "How many days each week can you get to a gym?"

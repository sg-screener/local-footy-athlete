appId: com.localfootyathlete.app
name: VISIBLE - Sam's ordered slice - remove Back Squat, Today, substitute, restart
tags:
  - e2e
  - visible
---
# SAM'S ORDERED VERTICAL SLICE, 2026-08-18:
#   Remove -> Back Squat -> Today -> Front Squat substitute -> visible success
#   -> restart -> Undo
#
# ⚠ **EVERY SUCCESS SENTENCE IS CHECKED AGAINST THE ROWS, NEVER ON ITS OWN.**
# Sam's clause is "no successful message without a visible state change", so the
# receipt is treated as a claim about the screen and the screen is then read.
#
# ⚠ **THE RECEIPT SHEET COVERS THE SCREEN AND MUST BE DISMISSED.** The first
# version of this walk asserted `workout-screen` straight after the scope answer
# and failed — not because the removal failed (it had already succeeded, and the
# rows behind the sheet were correct) but because the "Saved" sheet was still up.
# A flow that stops there reports a product defect that does not exist.
# ⚠ **THE SEED IS A PARAMETER, AND IT HAS TO BE.** This flow was pinned to
# `standard-in-season-week`, which is a ONE-microcycle world: its accepted block
# derives `requiredStrengthSessions: 1` where boot derives 4, so the reload gate
# below could never pass on it and the failure read exactly like a lost removal.
# `exercise-removal-restart` is the four-microcycle seed built for this walk.
# Pass it explicitly; the flow itself stays seed-agnostic, like the control arm.
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: ${SEED_ID}
- assertVisible:
    id: "e2e-explorer-launch-resolved-metro-url-http%3A%2F%2F127.0.0.1%3A8091"
- tapOn:
    id: "view-workout-button"
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 15000
- tapOn:
    id: "session-execution-toggle-strength"

# ── NON-VACUITY: the world really does contain the lift being removed ──────
# Addressed by NAME TOKEN, never by position — the position id carries the
# exercise name after the index, so `.*-back-squat` follows the row when it moves.
- assertVisible:
    id: "session-strength-position-.*-back-squat"
- takeScreenshot: artifacts/visible/slice-1-before

# ── REMOVE, ANSWERING "TODAY" ─────────────────────────────────────────────
- tapOn:
    id: "component-delete-action-.*"
- extendedWaitUntil:
    visible:
      id: "component-delete-confirm-.*"
    timeout: 10000
- tapOn:
    id: "component-delete-confirm-.*"
- extendedWaitUntil:
    visible:
      id: "component-delete-scope-.*-today"
    timeout: 10000
- takeScreenshot: artifacts/visible/slice-2-scope-question
- tapOn:
    id: "component-delete-scope-.*-today"

# ── THE RECEIPT, AND THEN THE ROWS THAT MUST BACK IT UP ───────────────────
- extendedWaitUntil:
    visible: "Saved"
    timeout: 15000
- takeScreenshot: artifacts/visible/slice-3-receipt
- tapOn: "Done"
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 20000
- runFlow:
    when:
      notVisible:
        id: "session-strength-position-.*"
    commands:
      - tapOn:
          id: "session-execution-toggle-strength"

# THE IDENTITY IS GONE, THE PATTERN IS KEPT BY A LEGAL LOADED VARIATION, AND
# NOTHING UNRELATED MOVED. All three are Sam's clauses and all three are read
# off the screen.
- assertNotVisible:
    id: "session-strength-position-.*-back-squat"
- assertVisible:
    id: "session-strength-position-.*-front-squat"
- assertVisible:
    id: "session-strength-position-.*-rdls"
- assertVisible:
    id: "session-strength-position-.*-single-leg-rdl"
- assertVisible:
    id: "session-strength-position-.*-band-pallof-press"
- takeScreenshot: artifacts/visible/slice-4-after-removal

# ── RESTART — a real relaunch the dev harness will actually honour ──────────
#
# ⚠ **A HAND-ROLLED `launchApp` IS REFUSED AT THE COLD-START GATE, AND THE
# REFUSAL READS EXACTLY LIKE A LOST DECISION.** This flow used to relaunch
# directly and it never survived. The harness launch leaves a CLOCK RECEIPT
# behind; relaunching with no CHECKPOINT record beside it makes
# `restoreDevE2EClockBeforeHydration` throw
#   DevE2EClock reload mismatch: clock receipt has no active checkpoint
# and App.tsx renders its "The app did not start" refusal surface instead of the
# program. The flow then polls `program-screen` until it times out and reports a
# PERSISTENCE failure that never happened. Photographed 2026-08-18 —
# `artifacts/visible/instrument-cold-start-refusal.png`.
#
# This is the FOURTH seat to hit this gate. `src/rules/lawRegistry.ts` already
# records "THREE HAND-DRIVEN ATTEMPTS DIED AT THE SAME DEV-HARNESS COLD-START
# GATE", which is the §8 SECOND-WALL count — so the restart is not hand-rolled
# here ever again. `../common/checkpoint-and-reload.yaml` is the owner of a
# legal relaunch and is the only way this flow restarts.
#
# **AND THE CHECKPOINT DOES NOT RE-SEED**, which is the thing that would have
# made this proof vacuous. `DevE2ESeedCoordinator.checkpoint()` requires an
# already-ready seed, captures the CURRENT memory fingerprints, waits for
# persistence, and THROWS if accepted state moved while it was being written.
# Taking it AFTER the removal therefore photographs the post-removal truth and
# makes the reload assert against it — a stronger proof than the bare relaunch,
# never a weaker one.
- runFlow:
    file: ../common/checkpoint-and-reload.yaml
    env:
      SEED_ID: ${SEED_ID}
- extendedWaitUntil:
    visible:
      id: "program-screen"
    timeout: 60000
- tapOn:
    id: "view-workout-button"
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 20000
- runFlow:
    when:
      notVisible:
        id: "session-strength-position-.*"
    commands:
      - tapOn:
          id: "session-execution-toggle-strength"
- assertNotVisible:
    id: "session-strength-position-.*-back-squat"
- assertVisible:
    id: "session-strength-position-.*-front-squat"
- takeScreenshot: artifacts/visible/slice-5-after-restart

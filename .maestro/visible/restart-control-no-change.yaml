appId: com.localfootyathlete.app
name: VISIBLE CONTROL - seed, checkpoint, reload, WITHOUT any athlete change
tags:
  - e2e
  - visible
---
# ⚠ **THIS FLOW MAKES NO CHANGE. THAT IS ITS ENTIRE POINT.**
#
# `removal-today-slice.yaml` fails its reload with
#   Reload persisted fingerprint mismatch for standard-in-season-week:
#   program-store expected=…6ae15ce4… actual=…f211a5ca…
# and the tempting reading is "the athlete's removal did not survive the
# restart". That reading is UNPROVEN while only one arm has been run: a gate
# that cannot pass for ANY world would produce the identical message on a world
# where nothing was removed.
#
# So this is the control arm — same seed, same checkpoint, same reload, same
# assertion, and NO removal in between. It decides which of the two it is:
#   GREEN here  → the gate works, and the removal is what breaks the reload.
#   RED here    → the gate cannot pass at all, the mismatch says nothing about
#                 the removal, and the instrument is the defect.
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: ${SEED_ID}
- assertVisible:
    id: "e2e-explorer-launch-resolved-metro-url-http%3A%2F%2F127.0.0.1%3A8091"
# The session is OPENED but nothing in it is touched — the removal flow had the
# workout screen mounted when it checkpointed, so the control matches that.
- tapOn:
    id: "view-workout-button"
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 15000
- tapOn:
    id: "session-execution-toggle-strength"
- assertVisible:
    id: "session-strength-position-.*-back-squat"
- runFlow:
    file: ../common/checkpoint-and-reload.yaml
    env:
      SEED_ID: ${SEED_ID}
- extendedWaitUntil:
    visible:
      id: "program-screen"
    timeout: 60000
- takeScreenshot: artifacts/visible/control-restart-${SEED_ID}

appId: com.localfootyathlete.app
name: VISIBLE - conditioning shows one title and one prescription
tags:
  - e2e
  - visible
  - conditioning
---
# Real pre-season/full-gym onboarding answers select an authored VO2 session.
# Assert the reached title/dose explicitly; never depend on reminted row IDs.
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: conditioning-showcase
- tapOn:
    id: "day-timeline-part-conditioning"
- tapOn:
    id: "view-workout-button"
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "session-execution-toggle-conditioning"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "4×4 VO₂ Max"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "workout-exercise-prescription-cond-.*"
- scrollUntilVisible:
    element:
      text: ".*Choose a pace you can repeat across all 4 rounds.*"
    direction: DOWN
    timeout: 10000
- assertVisible: ".*Work: 4 min hard.*"
- assertVisible: ".*Recovery: 3 min complete rest.*"
- assertVisible: ".*Rounds: 4.*"
- assertVisible: ".*Choose a pace you can repeat across all 4 rounds.*"
- assertNotVisible: "Hard Intervals"
- assertNotVisible: "Choose one.*"
- assertNotVisible: ".*1:1.*"
- assertNotVisible: ".*easy jog.*"
- assertNotVisible: ".*Heart rate.*"
- assertNotVisible: ".*Run hard, but do not sprint.*"
- takeScreenshot: artifacts/visible/conditioning-one-prescription
- scrollUntilVisible:
    element:
      id: "session-execution-check-exercise-cond-.*"
    direction: UP
- tapOn:
    id: "session-execution-check-exercise-cond-.*"
- assertVisible: "Completed: .*"
- scrollUntilVisible:
    element:
      id: finish-session-action
    direction: DOWN
- tapOn:
    id: finish-session-action
- tapOn:
    id: session-feedback-rpe-grid
- scrollUntilVisible:
    element:
      id: "session-feedback-save-.*"
    direction: DOWN
- tapOn:
    id: "session-feedback-save-.*"
- assertVisible:
    id: session-complete-moment-sheet
- takeScreenshot: artifacts/visible/conditioning-completion-overlay
- extendedWaitUntil:
    visible:
      id: program-screen
    timeout: 15000
- runFlow:
    file: ../common/checkpoint-and-reload.yaml
    env:
      SEED_ID: conditioning-showcase
- tapOn:
    id: view-completed-session-button
- scrollUntilVisible:
    element:
      id: session-execution-toggle-conditioning
    direction: DOWN
- assertVisible:
    id: session-execution-toggle-conditioning
    text: "Conditioning, 1 of 1 complete.*"
- assertVisible:
    id: "session-execution-check-exercise-cond-.*"
    text: "Completed: .*"
- takeScreenshot: artifacts/visible/conditioning-completed-reopened

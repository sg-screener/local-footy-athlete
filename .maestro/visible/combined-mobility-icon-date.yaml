appId: com.localfootyathlete.app
---
- runFlow: combined-mobility-icon-open.yaml
- repeat:
    times: '${WEEK_OFFSET}'
    commands:
      - tapOn:
          id: program-week-next
      - waitForAnimationToEnd
# Monday is visible without scrolling. Select it, then use the within-week
# Day controls. This avoids tapping a fixed header while a Week scroll settles.
- tapOn:
    id: day-row-mon
- waitForAnimationToEnd
- tapOn:
    id: program-view-today
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: program-day-current
    timeout: 15000
- assertVisible:
    id: day-row-mon
- repeat:
    times: '${["day-row-mon", "day-row-tue", "day-row-wed", "day-row-thu", "day-row-fri", "day-row-sat", "day-row-sun"].indexOf(DAY_ID)}'
    commands:
      - tapOn:
          id: program-day-next
      - waitForAnimationToEnd
- assertVisible:
    id: '${DAY_ID}'
- runFlow:
    when:
      visible:
        id: home-plan-options
    commands:
      - tapOn:
          id: home-plan-options
      - assertVisible: '${DAY_OPTIONS_DATE}'
      - tapOn: Back
- tapOn:
    id: program-view-week

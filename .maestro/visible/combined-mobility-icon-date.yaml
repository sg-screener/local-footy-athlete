appId: com.localfootyathlete.app
---
- runFlow: combined-mobility-icon-open.yaml
- repeat:
    times: '${WEEK_OFFSET}'
    commands:
      - tapOn:
          id: program-week-next
      - waitForAnimationToEnd
# The current week opens on Friday (earlier dates precede program start). Future
# weeks can select Monday. Both anchors are visible without scrolling.
- tapOn:
    id: '${Number(WEEK_OFFSET) === 0 ? "day-row-fri" : "day-row-mon"}'
- waitForAnimationToEnd
- tapOn:
    id: program-view-today
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: program-day-current
    timeout: 15000
- assertVisible:
    id: '${Number(WEEK_OFFSET) === 0 ? "day-row-fri" : "day-row-mon"}'
- repeat:
    times: '${["day-row-mon", "day-row-tue", "day-row-wed", "day-row-thu", "day-row-fri", "day-row-sat", "day-row-sun"].indexOf(DAY_ID) - (Number(WEEK_OFFSET) === 0 ? 4 : 0)}'
    commands:
      - tapOn:
          id: program-day-next
      - waitForAnimationToEnd
- assertVisible:
    id: '${DAY_ID}'
- runFlow:
    when:
      visible:
        id: home-plan-options
    commands:
      - tapOn:
          id: home-plan-options
      - assertVisible: '${DAY_OPTIONS_DATE}'
      - tapOn: Back
- tapOn:
    id: program-view-week

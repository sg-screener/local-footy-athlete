appId: com.localfootyathlete.app
name: VISIBLE - tired reduces volume, HOLDS load, says why, and survives restart
tags:
  - e2e
  - visible
---
# THE PROPERTY (approved contract, low-readiness order): "retain meaningful
# load/intensity where safe while performing less total work." So a tired day
# must show FEWER SETS and THE SAME KILOGRAMS — a reduction that also dropped the
# load would be a different, wrong answer, and a cell that only counted sets
# could not tell the two apart.
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week
- tapOn:
    id: "view-workout-button"
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 15000
- tapOn:
    id: "session-execution-toggle-strength"
# ── NON-VACUITY: the day starts at three sets and 110kg ──
- assertVisible:
    id: "exercise-set-count-dev-e2e-standard-in-season-week-2026-07-13-dow-1-exercise-ex-squat-1-3"
- assertVisible: "Edit weight, 110kg"
- takeScreenshot: artifacts/visible/c4-before
- tapOn:
    id: "tab-program"
- scrollUntilVisible:
    element:
      id: "home-life-fact-chips"
    direction: DOWN
    visibilityPercentage: 40
- tapOn:
    id: "home-tired-entry"
- extendedWaitUntil:
    visible:
      id: "readiness-option-cooked-week"
    timeout: 10000
- tapOn:
    id: "readiness-option-cooked-week"
- extendedWaitUntil:
    visible: "Done"
    timeout: 10000
- tapOn:
    text: "Done"
    optional: true
# ── THE ATHLETE IS TOLD WHY, ON THE DAY ──
- scrollUntilVisible:
    element:
      id: "modifiers-strip-day"
    direction: UP
    visibilityPercentage: 40
- assertVisible:
    id: "modifiers-strip-day"
- takeScreenshot: artifacts/visible/c4-after-why
# ── LESS WORK, SAME LOAD ──
- tapOn:
    id: "view-workout-button"
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 15000
- tapOn:
    id: "session-execution-toggle-strength"
# ⚠ THE ROW IDS ARE NOT THE SEED'S ANY MORE, AND THAT IS THE APP, NOT THE FLOW.
# A readiness answer at this strength REBUILDS the week, so the rows are
# re-minted with generated identities (`we-w-composed-…`) in place of the seed's
# (`dev-e2e-…-exercise-ex-squat-1`). Asserting the seed's ids after the rebuild
# would fail for a reason that has nothing to do with this property. The names
# and the loads are what the athlete reads, so they are what is asserted.
- assertVisible:
    id: "session-strength-position-1-back-squat"
- assertVisible:
    id: "session-strength-position-2-rdls"
# ── LESS TOTAL WORK: three sets became two. The id carries the VALUE. ──
- assertVisible:
    id: "exercise-set-count-we-w-composed-mc-ai-1-1-0-2"
- assertVisible:
    id: "exercise-set-count-we-w-composed-mc-ai-1-1-1-2"
# ── AND THE LOAD IS HELD, WHICH IS THE HALF A SET-COUNT CELL CANNOT SEE. ──
# The contract's low-readiness order is "retain meaningful load/intensity where
# safe while performing LESS TOTAL WORK". A reduction that also dropped the
# kilograms is a different and wrong answer, and would pass every cell above.
- assertVisible: "Edit weight, 110kg"
- assertVisible: "Edit weight, 90kg"
- takeScreenshot: artifacts/visible/c4-after-session

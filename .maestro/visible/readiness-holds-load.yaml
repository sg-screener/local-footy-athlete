appId: com.localfootyathlete.app
name: VISIBLE - cooked week reduces work, retains load, clears and survives restart
tags:
  - e2e
  - visible
---
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week
- tapOn:
    id: view-workout-button
- extendedWaitUntil:
    visible:
      id: workout-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Quick swap RDLs"
    direction: DOWN
    timeout: 20000
# Capture actual generated rows, never historical seed IDs or load numbers.
- copyTextFrom:
    id: workout-exercise-prescription-.*
    below: "Quick swap Back Squat"
    above: "Quick swap RDLs"
    index: 0
- evalScript: ${output.originalDose = maestro.copiedText}
- copyTextFrom:
    id: workout-exercise-load-.*
    below: "Quick swap Back Squat"
    above: "Quick swap RDLs"
    index: 0
- evalScript: ${output.originalLoad = maestro.copiedText}
- copyTextFrom:
    text: "Quick swap Back Squat"
- evalScript: ${output.originalIdentity = maestro.copiedText}
- assertTrue: ${parseInt(output.originalDose) > 1 && output.originalLoad.length > 0 && output.originalIdentity.length > 0}
- takeScreenshot: artifacts/visible/readiness-before
- tapOn:
    id: tab-program
- scrollUntilVisible:
    element:
      id: home-tired-entry
    direction: DOWN
- tapOn:
    id: home-tired-entry
- tapOn:
    id: readiness-option-cooked-week
- extendedWaitUntil:
    visible:
      id: home-week-readiness-confirmed-done
    timeout: 15000
- tapOn:
    id: home-week-readiness-confirmed-done
- scrollUntilVisible:
    element:
      id: modifiers-strip-day
    direction: UP
- assertVisible: "1 active modifier.*"
- tapOn:
    id: modifiers-strip-day
- assertVisible: "1 ACTIVE"
- takeScreenshot: artifacts/visible/readiness-explanation
- tapOn:
    id: coach-status-close
- tapOn:
    id: view-workout-button
- scrollUntilVisible:
    element:
      text: "Quick swap RDLs"
    direction: DOWN
    timeout: 20000
- copyTextFrom:
    id: workout-exercise-prescription-.*
    below: "Quick swap Back Squat"
    above: "Quick swap RDLs"
    index: 0
- evalScript: ${output.reducedDose = maestro.copiedText}
- assertTrue: ${parseInt(output.reducedDose) > 0 && parseInt(output.reducedDose) < parseInt(output.originalDose)}
- copyTextFrom:
    id: workout-exercise-load-.*
    below: "Quick swap Back Squat"
    above: "Quick swap RDLs"
    index: 0
- assertTrue: ${maestro.copiedText === output.originalLoad}
- copyTextFrom:
    text: "Quick swap Back Squat"
- assertTrue: ${maestro.copiedText === output.originalIdentity}
- takeScreenshot: artifacts/visible/readiness-reduced
- runFlow:
    file: ../common/checkpoint-and-reload.yaml
    env:
      SEED_ID: standard-in-season-week
- tapOn:
    id: view-workout-button
- scrollUntilVisible:
    element:
      text: "Quick swap RDLs"
    direction: DOWN
    timeout: 20000
- copyTextFrom:
    id: workout-exercise-prescription-.*
    below: "Quick swap Back Squat"
    above: "Quick swap RDLs"
    index: 0
- assertTrue: ${maestro.copiedText === output.reducedDose}
- copyTextFrom:
    id: workout-exercise-load-.*
    below: "Quick swap Back Squat"
    above: "Quick swap RDLs"
    index: 0
- assertTrue: ${maestro.copiedText === output.originalLoad}
- tapOn:
    id: tab-program
- tapOn:
    id: modifiers-strip-day-header
- tapOn:
    id: coach-status-modifier-.*
- tapOn: "I'm good now"
- tapOn: "Clear and update program"
- extendedWaitUntil:
    visible:
      id: coach-status-empty
    timeout: 15000
- tapOn:
    id: coach-status-close
- runFlow:
    file: ../common/checkpoint-and-reload.yaml
    env:
      SEED_ID: standard-in-season-week
- assertNotVisible:
    id: modifiers-strip-day
- tapOn:
    id: view-workout-button
- scrollUntilVisible:
    element:
      text: "Quick swap RDLs"
    direction: DOWN
    timeout: 20000
- copyTextFrom:
    id: workout-exercise-prescription-.*
    below: "Quick swap Back Squat"
    above: "Quick swap RDLs"
    index: 0
- assertTrue: ${maestro.copiedText === output.originalDose}
- copyTextFrom:
    id: workout-exercise-load-.*
    below: "Quick swap Back Squat"
    above: "Quick swap RDLs"
    index: 0
- assertTrue: ${maestro.copiedText === output.originalLoad}
- takeScreenshot: artifacts/visible/readiness-cleared-restarted

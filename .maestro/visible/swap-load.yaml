appId: com.localfootyathlete.app
name: VISIBLE - chosen replacement owns its load; other rows and restart agree
tags:
  - e2e
  - visible
---
# Deliberately seek Front Squat through the actual ranked quick-swap owner.
# Do not assume the first offer. The seed's own loadForReplacementExercise
# answers 67.5 kg for Front Squat, independently of the outgoing lift.
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week
- tapOn:
    id: view-workout-button
- scrollUntilVisible:
    element:
      text: "Quick swap RDLs"
    direction: DOWN
- assertVisible: "Quick swap Back Squat"
- copyTextFrom:
    id: workout-exercise-load-.*
    below: "Quick swap Back Squat"
    above: "Quick swap RDLs"
    index: 0
- evalScript: ${output.outgoingLoad = maestro.copiedText}
- tapOn:
    id: exercise-cue-toggle-we-w-composed-.*
    index: 0
- scrollUntilVisible:
    element:
      text: "Quick swap RDLs"
    direction: DOWN
- takeScreenshot: artifacts/visible/form-cues-expanded-load-below
- tapOn:
    id: exercise-cue-toggle-we-w-composed-.*
    index: 0
- scrollUntilVisible:
    element:
      text: "Quick swap Cossack Squat"
    direction: DOWN
- copyTextFrom:
    id: workout-exercise-load-.*
    below: "Quick swap RDLs"
    above: "Quick swap Cossack Squat"
    index: 0
- evalScript: ${output.otherLoad = maestro.copiedText}
- copyTextFrom:
    id: workout-exercise-prescription-.*
    below: "Quick swap RDLs"
    above: "Quick swap Cossack Squat"
    index: 0
- evalScript: ${output.otherDose = maestro.copiedText}
- scrollUntilVisible:
    element:
      text: "Quick swap Back Squat"
    direction: UP
- repeat:
    while:
      notVisible: "Quick swap Front Squat"
    times: 4
    commands:
      - tapOn:
          text: "Quick swap (Back Squat|Single-Leg.*Squat.*|Box Squat|High Box Squat)"
- assertVisible: "Quick swap Front Squat"
- scrollUntilVisible:
    element:
      text: "Quick swap RDLs"
    direction: DOWN
- copyTextFrom:
    id: workout-exercise-load-.*
    below: "Quick swap Front Squat"
    above: "Quick swap RDLs"
    index: 0
- evalScript: ${output.replacementLoad = maestro.copiedText}
- assertTrue: ${output.replacementLoad === "Edit weight, 67.5kg" && output.replacementLoad !== output.outgoingLoad}
- takeScreenshot: artifacts/visible/swap-own-load
- scrollUntilVisible:
    element:
      text: "Quick swap Cossack Squat"
    direction: DOWN
- copyTextFrom:
    id: workout-exercise-load-.*
    below: "Quick swap RDLs"
    above: "Quick swap Cossack Squat"
    index: 0
- assertTrue: ${maestro.copiedText === output.otherLoad}
- copyTextFrom:
    id: workout-exercise-prescription-.*
    below: "Quick swap RDLs"
    above: "Quick swap Cossack Squat"
    index: 0
- assertTrue: ${maestro.copiedText === output.otherDose}
- runFlow:
    file: ../common/checkpoint-and-reload.yaml
    env:
      SEED_ID: standard-in-season-week
- tapOn:
    id: view-workout-button
- scrollUntilVisible:
    element:
      text: "Quick swap RDLs"
    direction: DOWN
- assertVisible: "Quick swap Front Squat"
- assertNotVisible: "Quick swap Back Squat"
- copyTextFrom:
    id: workout-exercise-load-.*
    below: "Quick swap Front Squat"
    above: "Quick swap RDLs"
    index: 0
- assertTrue: ${maestro.copiedText === output.replacementLoad}
- scrollUntilVisible:
    element:
      text: "Quick swap Cossack Squat"
    direction: DOWN
- copyTextFrom:
    id: workout-exercise-load-.*
    below: "Quick swap RDLs"
    above: "Quick swap Cossack Squat"
    index: 0
- assertTrue: ${maestro.copiedText === output.otherLoad}
- copyTextFrom:
    id: workout-exercise-prescription-.*
    below: "Quick swap RDLs"
    above: "Quick swap Cossack Squat"
    index: 0
- assertTrue: ${maestro.copiedText === output.otherDose}
- takeScreenshot: artifacts/visible/swap-restarted

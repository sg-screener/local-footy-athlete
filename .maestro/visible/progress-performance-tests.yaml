appId: com.localfootyathlete.app
name: Progress performance tests and measurements
---
- runFlow:
    when:
      visible: "Open in “Local Footy Athlete”?"
    commands:
      - tapOn:
          point: "70%, 53%"
- runFlow:
    when:
      visible: "Clear test-harness state and start"
    commands:
      - tapOn: "Clear test-harness state and start"
- extendedWaitUntil:
    visible:
      id: "tab-progress"
    timeout: 30000
- tapOn:
    id: "tab-progress"
- scrollUntilVisible:
    element:
      id: "progress-performance-tests"
    direction: DOWN
    visibilityPercentage: 60
- assertVisible: "Performance tests"
- assertVisible:
    id: "progress-test-aerobic"
- assertVisible:
    id: "progress-test-anaerobic"
- assertVisible:
    id: "progress-test-sprint"
- tapOn:
    id: "progress-test-aerobic"
- assertVisible: "Choose a test and record your result"
- assertVisible: "3km TT"
- tapOn:
    id: "progress-select-three_km_tt"
- tapOn:
    id: "progress-test-result-input"
- inputText: "720"
- tapOn:
    id: "progress-save-test-result"
- extendedWaitUntil:
    visible:
      id: "progress-test-aerobic"
      text: ".*12:00.*"
    timeout: 30000
- tapOn:
    id: "progress-test-aerobic"
- tapOn:
    id: "progress-select-three_km_tt"
- tapOn:
    id: "progress-test-result-input"
- inputText: "690"
- tapOn:
    id: "progress-save-test-result"
- extendedWaitUntil:
    visible:
      id: "progress-test-aerobic"
      text: ".*11:30.*4.2% better.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "progress-measurements"
    direction: DOWN
    visibilityPercentage: 60
- tapOn:
    id: "progress-height-input"
- eraseText
- inputText: "181"
- tapOn:
    id: "progress-weight-input"
- eraseText
- inputText: "81"
- tapOn:
    id: "progress-save-measurements"
- extendedWaitUntil:
    visible:
      id: "tab-progress"
    timeout: 30000
- tapOn:
    id: "tab-progress"
- scrollUntilVisible:
    element:
      id: "progress-measurements"
    direction: DOWN
    visibilityPercentage: 60
- repeat:
    times: 2
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 28%
          duration: 450
- assertVisible:
    id: "progress-height-input"
    text: ".*181.*"
- assertVisible:
    id: "progress-weight-input"
    text: ".*81.*"
- takeScreenshot: artifacts/visible/progress-performance-tests

appId: com.localfootyathlete.app
name: VISIBLE - affected-row notice shares the exercise text edge
tags:
  - e2e
  - visible
  - workout
  - alignment
---
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week
- tapOn:
    id: "view-workout-button"
- extendedWaitUntil:
    visible:
      id: "workout-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "workout-exercise-swapped-badge-.*"
    direction: DOWN
- assertVisible: "Swapped from Single-Leg RDL — equipment today"
- takeScreenshot: artifacts/visible/affected-row-notice-alignment

appId: com.localfootyathlete.app
name: Reported injury remains visible after reopening and clears through My Status
tags:
  - visible
  - programming-gap
---
# Continues an injury entered through actual screens in the accumulated world:
# three existing session-add modifiers must survive clearing only the injury.
- launchApp:
    clearState: false
    stopApp: true
    arguments:
      e2eMetroUrl: '${E2E_METRO_URL}'
      e2eLaunchPurpose: action-reload
- extendedWaitUntil:
    visible:
      id: program-screen
    timeout: 30000
- assertNotVisible:
    id: onboarding-welcome-cta
- tapOn:
    id: modifiers-strip-day-header
- assertVisible: '4 ACTIVE'
- assertVisible: 'Shoulder issue active|Training paused for injury'
- tapOn: 'Shoulder issue active|Training paused for injury'
- scrollUntilVisible:
    element:
      text: Injury resolved
    direction: DOWN
- takeScreenshot: artifacts/gap/injury-modifier-after-reopen
- tapOn:
    text: Injury resolved
- tapOn: Clear and update program
- extendedWaitUntil:
    notVisible: 'Shoulder issue active|Training paused for injury'
    timeout: 30000
- assertVisible: '3 ACTIVE'
- takeScreenshot: artifacts/gap/injury-cleared
- launchApp:
    clearState: false
    stopApp: true
    arguments:
      e2eMetroUrl: '${E2E_METRO_URL}'
      e2eLaunchPurpose: final-step-reload
- extendedWaitUntil:
    visible:
      id: program-screen
    timeout: 30000
- tapOn:
    id: modifiers-strip-day-header
- assertNotVisible: 'Shoulder issue active|Training paused for injury'
- assertVisible: '3 ACTIVE'
- takeScreenshot: artifacts/gap/injury-clear-after-reopen
- tapOn:
    id: coach-status-close

appId: com.localfootyathlete.app
name: AUDIT - a readiness report is acknowledged honestly, never in silence
tags:
  - e2e
  - audit
---
# LAUNCH AUDIT 2026-08-25, FINDING #8 (the readiness half). A record-only
# "bit tired" report was acknowledged with "Your week's adjusted to match" —
# a claim about an adjustment that did not happen. Fixed 7174a6b6: the effect
# clause is selected by the COMMITTED result (test:readiness-acknowledgment
# holds the sentence table). This flow proves the on-glass half: the tap is
# acknowledged (the old defect was silence), and a record-only report shows
# the honest sentence, not the adjustment claim.
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week

- scrollUntilVisible:
    element:
      id: "home-life-fact-chips"
    direction: DOWN
    visibilityPercentage: 40
- tapOn:
    id: "home-tired-entry"
- extendedWaitUntil:
    visible:
      id: "readiness-option-tired-today"
    timeout: 10000
- tapOn:
    id: "readiness-option-tired-today"

# ── ACKNOWLEDGED, AND HONESTLY ────────────────────────────────────────────
# The success ack container carries the sentence. "Bit tired" is record-only
# in this seed world, so the honest sentence is the logged one; the adjustment
# clause may only appear on a result that changed the program.
# 2026-08-31 (Sam, physical-device correction to R-275, `1aa24fdb`): a
# record-only "tired today" report is acknowledged on the sheet itself, in
# the signed sentence below, with a Done button — never a silent close and
# never an error. The old "Got it — logged how you're feeling." ack no
# longer renders for this report; the flow was re-pinned on 2026-09-03.
- extendedWaitUntil:
    visible:
      id: "home-week-readiness-confirmed"
    timeout: 10000
- assertVisible: "You should be okay to train as planned, but if you start feeling flatter, let me know and we’ll pull things back."
- assertNotVisible:
    id: "home-week-readiness-ack-error"
- tapOn:
    id: "home-week-readiness-confirmed-done"
# The report is recorded, not just acknowledged: the day's modifier strip
# now carries it.
- extendedWaitUntil:
    visible:
      id: "modifiers-strip-day"
    timeout: 10000
- takeScreenshot: artifacts/audit/readiness-honest-ack

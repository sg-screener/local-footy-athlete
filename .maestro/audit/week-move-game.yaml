appId: com.localfootyathlete.app
name: AUDIT - moving the game lives inside Manage week, saves, and survives a relaunch
tags:
  - e2e
  - audit
---
# Sam's phone finding (2026-08-26, `93fa246b`): the weekly menu moves the game.
# Since `d77cb459` (2026-08-26, week controls) the week ⋯ sheet offers
# "I'm going away" and "Manage week"; moving the game is a drag on the
# Manage-week board, finished by Save changes. Sam, 2026-09-03: "Move-game is
# inside Manage week now … drag the game, save, relaunch, confirm it stayed
# moved." Re-pinned to that route on 2026-09-03, proven by hand first.
#
# The seed's game is Saturday 2026-07-18. The drag starts on the game card
# (`week-board-box-<date>-game`) and ends on the empty Sunday row
# (`week-board-day-<date>`); the board's drag activates after a 220 ms hold,
# so the swipe is slow. After Save, the week view shows the fixture on Sunday
# and Saturday is no longer the fixture; the checkpoint reload proves it is
# persisted, not just drawn.
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week
- tapOn:
    id: "program-view-week"
- tapOn:
    id: "edit-week-button"
- extendedWaitUntil:
    visible:
      id: "edit-week-session"
    timeout: 10000
- tapOn:
    id: "edit-week-session"
- extendedWaitUntil:
    visible:
      id: "week-board"
    timeout: 10000
- assertVisible:
    id: "week-board-box-2026-07-18-game"
- swipe:
    start: "56%, 66%"
    end: "56%, 74%"
    duration: 3000
- extendedWaitUntil:
    visible:
      id: "week-board-box-2026-07-19-game"
    timeout: 10000
- assertNotVisible:
    id: "week-board-box-2026-07-18-game"
- tapOn:
    id: "week-board-save"
- extendedWaitUntil:
    visible:
      id: "day-row-sun-state-fixture"
    timeout: 25000
- assertNotVisible:
    id: "day-row-sat-state-fixture"
- takeScreenshot: artifacts/audit/week-move-game-saved
- runFlow:
    file: ../common/checkpoint-and-reload.yaml
    env:
      SEED_ID: standard-in-season-week
- tapOn:
    id: "program-view-week"
- extendedWaitUntil:
    visible:
      id: "day-row-sun-state-fixture"
    timeout: 25000
- assertNotVisible:
    id: "day-row-sat-state-fixture"
- takeScreenshot: artifacts/audit/week-move-game-relaunched

# ── AFTER THE RELAUNCH: NO CARD ON MY STATUS (R-271), THEN "MOVE IT BACK" ──
# Sam, 2026-09-03: "Keep the card off — my 28 August ruling stands. Call the
# Manage week route 'move it back', not Undo." R-271: session and fixture
# edits are history, not Active Modifiers, so My Status carries no "Game
# moved" card, live or after a relaunch (`test:modifier-lifecycle` holds it in
# the release gate). After a relaunch the athlete moves the game back on the
# board: Manage week, drag it to Saturday, save. This proves that route.
- tapOn:
    id: "modifiers-strip-week-header"
- extendedWaitUntil:
    visible:
      id: "coach-status-screen"
    timeout: 10000
- assertNotVisible: "Game moved"
- takeScreenshot: artifacts/audit/week-move-game-my-status-after-relaunch
- tapOn:
    id: "coach-status-close"
- extendedWaitUntil:
    visible:
      id: "edit-week-button"
    timeout: 10000
- tapOn:
    id: "edit-week-button"
- extendedWaitUntil:
    visible:
      id: "edit-week-session"
    timeout: 10000
- tapOn:
    id: "edit-week-session"
- extendedWaitUntil:
    visible:
      id: "week-board"
    timeout: 10000
- assertVisible:
    id: "week-board-box-2026-07-19-game"
- swipe:
    start: "56%, 74%"
    end: "56%, 66%"
    duration: 3000
- extendedWaitUntil:
    visible:
      id: "week-board-box-2026-07-18-game"
    timeout: 10000
- assertNotVisible:
    id: "week-board-box-2026-07-19-game"
- tapOn:
    id: "week-board-save"
- extendedWaitUntil:
    visible:
      id: "day-row-sat-state-fixture"
    timeout: 25000
- assertNotVisible:
    id: "day-row-sun-state-fixture"
- takeScreenshot: artifacts/audit/week-move-game-moved-back

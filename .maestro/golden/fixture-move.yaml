appId: com.localfootyathlete.app
name: Golden - move fixture by domain day
tags:
  - e2e
  - golden
  - fixture
---
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: fixture-move
# A GAME IS ON SATURDAY, AND SATURDAY IS NOT TODAY. The day-first shape draws
# one day at full size; a flow that acts on any other day is a WEEK-shape flow
# and now says so (2026-08-10). Moving a fixture is a week-level act anyway —
# the athlete is choosing among all seven days — so this is the shape the
# screen itself forces for the picker.
- runFlow:
    file: ../common/show-week-shape.yaml
- scrollUntilVisible:
    element:
      id: "day-row-sat"
    direction: DOWN
- tapOn:
    id: "day-row-sat"
- tapOn:
    id: "fixture-actions-open"
- tapOn:
    id: "fixture-move-action"
- assertVisible:
    id: "day-row-sun-state-move-target"
- tapOn:
    id: "day-row-sun"
- extendedWaitUntil:
    visible:
      id: "day-row-sun-state-fixture"
    timeout: 15000

# LAW-flows-photograph-what-they-touch: a flow proves PRESENCE, and every
# layout defect is a question about WHERE, which no id can carry. Two real
# ones shipped past green flows on 2026-08-10 — a control rendered over the
# battery icon, and a title that swamped the screen. The picture is the
# instrument; this is the state this flow ends on.
- takeScreenshot: artifacts/ui-walk/fixture-move-end

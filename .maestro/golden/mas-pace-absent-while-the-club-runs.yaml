appId: com.localfootyathlete.app
name: Golden - NON-VACUITY - no %MAS session, so no pace, while the club runs
tags:
  - e2e
  - golden
  - program
  - conditioning
---
# THE NON-VACUITY HALF OF `mas-session-names-his-own-pace.yaml`. READ BOTH OR
# NEITHER — this file exists only to make that one capable of failing.
#
# **MEASURED, NOT ASSUMED (2026-08-13):** an in-season week WITH A CLUB
# prescribes NO %MAS AT ALL. `generateProgramLocally` over
# `DEV_E2E_STANDARD_PROFILE` yields ZERO rows carrying a MAS band; the same
# profile with the club removed yields 8. **The club supplies the running.**
# So the pace line correctly renders NOWHERE here, and its absence is the app
# being right rather than the reader being broken.
#
# WITHOUT THIS FILE its pair is a cell that has never been able to fail: a pace
# asserted on a screen where one always appears would prove nothing about the
# trip, the club, or `rules/masPace.ts`.
#
# ── WHY THIS IS A SEPARATE FILE AND NOT A SECOND ARM ──
#
# Both arms were one flow first. **A SECOND clear-state launch inside one run
# never comes ready** — `e2e-seed-ready-standard-in-season-week` failed while the
# identical first call in the same run passed. And `- back` does not return to
# the program screen: on iOS it is an edge swipe, and from a stack root it
# BACKGROUNDS THE APP to the springboard (observed, 2026-08-13). The session
# screen's back control carries no testID, so there is no tap that leaves it.
# **One seeded launch per run is the harness's real shape; two files is what
# that shape allows.**
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week
- tapOn:
    id: "view-workout-button"
- extendedWaitUntil:
    visible:
      id: "day-workout-title"
    timeout: 10000
# ⚠ THE FIRST VERSION OF THIS FILE PASSED FOR THE WRONG REASON, AND THE
# SCREENSHOT IS WHAT CAUGHT IT. It asserted the pace absent straight after
# opening the session — and `SessionExecutionSection` starts COLLAPSED
# (`expanded = React.useState(false)`), so the conditioning rows were not in the
# tree at all. **"No pace" was true of a section nobody had opened**, which is
# the same vacuity this file exists to prevent in its pair. Expand it first, and
# assert the section really did open before reading anything out of it.
- assertVisible:
    id: "session-execution-section-conditioning"
- tapOn:
    id: "session-execution-toggle-conditioning"
- extendedWaitUntil:
    visible:
      id: "workout-exercise-row-.*"
    timeout: 10000
# NOW the absence means something: conditioning rows ARE rendered, and none of
# them carries a pace, because none of them prescribes a %MAS.
- assertNotVisible:
    id: "workout-exercise-pace-.*"
- takeScreenshot: artifacts/ui-walk/pace-absent-while-the-club-runs

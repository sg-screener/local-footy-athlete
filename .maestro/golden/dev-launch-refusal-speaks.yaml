appId: com.localfootyathlete.app
name: Golden - a refused development launch says so, and offers the way out
tags:
  - e2e
  - golden
  - boot
---
# SAM'S WHITE SCREEN, 2026-08-10 19:22, TURNED INTO A FLOW.
#
# THE FOUNDING CASE, REPRODUCED HERE EXACTLY. A harness run leaves a dev clock
# receipt in storage. The next PLAIN launch — the way Sam opens the app — reads a
# receipt with no matching checkpoint, `restoreDevE2EClockBeforeHydration` throws
# "clock receipt has no active checkpoint", `prepareDevE2EAppLaunch` returned a
# bare `false`, and `App.tsx` simply never mounted RootNavigator. **The app
# rendered a root with nothing in it, forever, with no error and no text.**
#
# THIS FLOW IS THE ONLY INSTRUMENT THAT CAN SEE IT. Every source-reading cell in
# the chain passes on a white screen — there is nothing wrong with the code that
# did not run. The sequence below is the defect's own shape: seed through the
# harness, then launch WITHOUT it.
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week

# ── THE PLAIN LAUNCH — no e2eMetroUrl, no purpose, no seed ────────────────────
# `clearState` is deliberately NOT set: the leftover harness state is the whole
# point, and clearing it would delete the condition under test.
- launchApp:
    appId: com.localfootyathlete.app

# ── IT SPEAKS ────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "dev-launch-refused"
    timeout: 25000
# THE REASON IS ON THE SCREEN, NOT JUST IN A LOG. A refusal that says only "it
# refused" is the white screen with a border — the developer still has to go
# digging for which of the barrier's steps failed.
- assertVisible:
    id: "dev-launch-refused-reason"

# ── AND THERE IS A WAY OUT ────────────────────────────────────────────────────
# One tap clears the three dev-E2E records and re-runs the barrier. Without this
# the screen is honest and still a dead end.
- tapOn:
    id: "dev-launch-refused-clear"
- extendedWaitUntil:
    visible:
      id: "program-screen"
    timeout: 25000
- assertNotVisible:
    id: "dev-launch-refused"

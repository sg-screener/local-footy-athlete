appId: com.localfootyathlete.app
name: Golden - reload preserves accepted standard week
tags:
  - e2e
  - golden
  - persistence
---
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week
- runFlow:
    file: ../common/checkpoint-and-reload.yaml
    env:
      SEED_ID: standard-in-season-week
- assertVisible:
    id: "program-screen"
- scrollUntilVisible:
    element:
      id: "day-row-sat-state-fixture"
    direction: DOWN
- assertVisible:
    id: "day-row-sat-state-fixture"

# LAW-flows-photograph-what-they-touch: a flow proves PRESENCE, and every
# layout defect is a question about WHERE, which no id can carry. Two real
# ones shipped past green flows on 2026-08-10 — a control rendered over the
# battery icon, and a title that swamped the screen. The picture is the
# instrument; this is the state this flow ends on.
- takeScreenshot: artifacts/ui-walk/reload-standard-week-end

appId: com.localfootyathlete.app
name: Golden - live checklist and session feedback
tags:
  - e2e
  - golden
  - workout
  - feedback
---
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: one-set-strength
# RE-AIMED, 2026-08-10. The `tapOn: day-row-mon` that used to open Monday's
# card is gone: in the day-first shape the day the screen is about is ALREADY
# open, so there is nothing to expand — and the tap is no longer harmless,
# because the centre of that card is now the component timeline, whose tap
# opens the session directly. The flow was tapping its way past the button it
# then went looking for.
- tapOn:
    id: "view-workout-button"
- scrollUntilVisible:
    element:
      id: "session-execution-toggle-strength"
    direction: DOWN
- tapOn:
    id: "session-execution-toggle-strength"
- extendedWaitUntil:
    visible:
      id: "session-execution-check-exercise-dev-e2e-one-set-main"
    timeout: 10000
- tapOn:
    id: "session-execution-check-exercise-dev-e2e-one-set-main"
# The first screenshot proves the athlete can open a component and that a
# checked row visibly recedes while the remaining work stays live.
- takeScreenshot: artifacts/ui-walk/session-checklist-partial
- scrollUntilVisible:
    element:
      id: "finish-session-action"
    direction: DOWN
- tapOn:
    id: "finish-session-action"
- scrollUntilVisible:
    element:
      id: "feedback-session-rpe-4"
    direction: DOWN
- tapOn:
    id: "feedback-session-rpe-4"
- takeScreenshot: artifacts/ui-walk/session-feedback-one-to-five
- scrollUntilVisible:
    element:
      id: "session-feedback-save-.*"
    direction: DOWN
- tapOn:
    id: "session-feedback-save-.*"
- assertVisible:
    id: "session-completion"
- takeScreenshot: artifacts/ui-walk/one-set-feedback-end
- extendedWaitUntil:
    visible:
      id: "program-screen"
    timeout: 15000
- assertVisible:
    id: "day-complete-mon"
# LAW-flows-photograph-what-they-touch: this final frame also holds the one
# completed-state sentence on the day card — tick + Session complete, without
# the retired Done badge competing with CORE.
- takeScreenshot: artifacts/ui-walk/session-complete-day-card

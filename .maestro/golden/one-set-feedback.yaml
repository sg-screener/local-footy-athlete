appId: com.localfootyathlete.app
name: Golden - one-set prescription and session feedback
tags:
  - e2e
  - golden
  - workout
  - feedback
---
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: one-set-strength
# RE-AIMED, 2026-08-10. The `tapOn: day-row-mon` that used to open Monday's
# card is gone: in the day-first shape the day the screen is about is ALREADY
# open, so there is nothing to expand — and the tap is no longer harmless,
# because the centre of that card is now the component timeline, whose tap
# opens the session directly. The flow was tapping its way past the button it
# then went looking for.
- tapOn:
    id: "view-workout-button"
- extendedWaitUntil:
    visible:
      id: "exercise-set-count-dev-e2e-one-set-main-1"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "finish-session-action"
    direction: DOWN
- tapOn:
    id: "finish-session-action"
- scrollUntilVisible:
    element:
      id: "feedback-strength-completion-full"
    direction: DOWN
- tapOn:
    id: "feedback-strength-completion-full"
- scrollUntilVisible:
    element:
      id: "feedback-support-completion-full"
    direction: DOWN
- tapOn:
    id: "feedback-support-completion-full"
- scrollUntilVisible:
    element:
      id: "feedback-recovery-addon-completion-full"
    direction: DOWN
- tapOn:
    id: "feedback-recovery-addon-completion-full"
- scrollUntilVisible:
    element:
      id: "feedback-feeling-good"
    direction: DOWN
- tapOn:
    id: "feedback-feeling-good"
- scrollUntilVisible:
    element:
      id: "feedback-soreness-none"
    direction: DOWN
- tapOn:
    id: "feedback-soreness-none"
- scrollUntilVisible:
    element:
      id: "feedback-save-action"
    direction: DOWN
- tapOn:
    id: "feedback-save-action"
- assertVisible:
    id: "session-completion"

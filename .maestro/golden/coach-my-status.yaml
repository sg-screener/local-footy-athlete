appId: com.localfootyathlete.app
name: Golden - my status, reached directly from Day and Week
tags:
  - e2e
  - golden
  - coach
  - ui-merge
---
# MY STATUS IS THE ONE STATUS DESTINATION.
#
# Source cells can prove components are mounted and share a selector. This flow
# proves the athlete can reach the empty and populated states, choose a season
# phase before the existing setup questions, and keep Coach Notes off Program.
#
# A MODIFIER HAS TO BE REAL. It is made through the equipment door: three taps,
# stable ids, and a real active constraint rather than a hand-built store seed.
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week

# ── NOTHING ACTIVE: THE DAY HEADER STILL OPENS MY STATUS DIRECTLY ──
#
# THIS LINE IS NOT INVERTED, AND THAT IS DELIBERATE — READ BEFORE "FIXING" IT.
# SEAT_INBOX item 16 lists this assertion among four to flip when the day/week
# notice is built. Three of the four sat at points where a real modifier
# exists. THIS ONE DOES NOT: the seed has just been reset and nothing is
# active, which is why the block it heads is called "NOTHING ACTIVE".
#
# So its MEANING inverted while its text stayed. It used to record that the
# notice was never built; it now proves item 16 rule (e) — "Zero means nothing
# on Program" — which is the behaviour `ModifiersStrip` gets from returning
# null at `count <= 0` for non-coach surfaces. Flipping it to `assertVisible`
# would assert the opposite of the rule it was cited to protect, and would ask
# a quiet week to carry an empty notice.
#
# The Coach assertion two lines down is the counterweight and always was:
# zero deletes Program's notice, and never My Status's doorway.
- assertNotVisible:
    id: "modifiers-strip-day"
- assertVisible:
    id: "modifiers-strip-day-header"
- tapOn:
    id: "modifiers-strip-day-header"
- assertVisible:
    id: "coach-status-screen"
- assertVisible:
    id: "coach-status-empty"

# ── REVIEW CHOOSES A TARGET BEFORE THE EXISTING QUESTIONS ──
- assertVisible:
    id: "coach-status-season-phase"
- tapOn:
    id: "coach-status-season-phase"
- assertVisible: "Review season phase"
- assertVisible:
    id: "season-phase-option-in-season"
- assertVisible:
    id: "season-phase-option-pre-season"
- assertVisible:
    id: "season-phase-option-off-season"
- takeScreenshot: artifacts/ui-walk/season-phase-review
- tapOn:
    id: "season-phase-option-pre-season"
- tapOn: "Confirm phase"
- assertVisible: "What days can you train?"
- tapOn: "Continue"
- assertVisible: "Which days does your team train?"
- tapOn: "Cancel"
- assertVisible:
    id: "coach-status-screen"
- tapOn:
    id: "coach-status-close"

# ── THE ATHLETE MAKES ONE, THROUGH A DOOR THEY ALREADY HAD ──
# RE-ROUTED 2026-08-12 THROUGH THE READINESS DOOR, AND THE OLD ROUTE IS A
# FINDING, NOT A PREFERENCE. This block used to open `equipment-preset-open` —
# an id NO PRODUCT SOURCE PRODUCES any more (`grep` finds it only in this flow
# and in a test that reads this flow). The flow had been aiming at nothing, and
# `test:maestro-element-contract` is already red on that class of drift; it is
# pre-existing and belongs to whoever retired that door, not to this unit.
#
# `visibilityPercentage: 40` because the chips sit low in a tall card and a
# 100%-visible requirement never settles on an iPhone frame.
- scrollUntilVisible:
    element:
      id: "home-life-fact-chips"
    direction: DOWN
    visibilityPercentage: 40
- tapOn:
    id: "home-tired-entry"
- extendedWaitUntil:
    visible:
      id: "readiness-option-cooked-week"
    timeout: 10000
- tapOn:
    id: "readiness-option-cooked-week"
# THE ACK IS A CONFIRMATION, NOT A GATE. It reports that the report landed and
# the week recomposed; whether it is still on screen by the time the next tap
# lands is a race, not a property. `optional: true` because the modifier is
# already written by this point — waiting on the acknowledgment would make this
# flow fail on timing rather than on behaviour.
- extendedWaitUntil:
    visible: "Done"
    timeout: 10000
- tapOn:
    text: "Done"
    optional: true

# ── PROGRAM NOW SAYS SO; MY STATUS OWNS THE DETAIL ──
#
# INVERTED 2026-08-13 (SEAT_INBOX item 16), and this is the one of the four
# named assertions that had a real modifier under it. A "cooked week" readiness
# report was just filed through the athlete's own door, so the count is not
# zero, and Sam's ruling — *"one line on week, small card on day, read-only
# both"* — says the day screen must show it.
#
# "PROGRAM STAYS CLEAN" WAS THE OLD HEADING AND IT MEANT TWO THINGS AT ONCE:
# no notice, and no list. Only the first was ruled away. The list assertion is
# still below, on the Coach tab, where the list is allowed to be.
- assertVisible:
    id: "modifiers-strip-day"
# THE NOTICE IS A DOOR, AND A DOOR THAT DOES NOT OPEN IS DECORATION. Tapping it
# from Program must land on the SAME My Status screen the Coach strip opens —
# one destination, reached from either side, which is the whole reason the open
# state is a navigation param rather than a Coach-private boolean.
- tapOn:
    id: "modifiers-strip-day"
- extendedWaitUntil:
    visible:
      id: "coach-status-screen"
    timeout: 10000
- assertVisible:
    id: "program-active-coach-notes"
- takeScreenshot: artifacts/ui-walk/day-modifier-notice-opens-status
- tapOn:
    id: "coach-status-close"
- tapOn:
    id: "program-view-week"
- assertVisible:
    id: "modifiers-strip-week-header"
- tapOn:
    id: "modifiers-strip-week-header"
- extendedWaitUntil:
    visible:
      id: "coach-status-screen"
    timeout: 10000
- assertVisible:
    id: "program-active-coach-notes"
- assertVisible:
    id: "coach-status-season-phase"
- takeScreenshot: artifacts/ui-walk/week-my-status

# ── (a) THE CONTROLS ARE LIVE, AND THIS IS WHERE THAT IS PROVEN ON GLASS ──
#
# UNTIL 2026-08-12 THIS BLOCK ASSERTED THE OPPOSITE. It tapped the row and
# required `coach-note-actions-not-yet` — the caption reading "Change this on
# your program screen for now" — to be visible. SEAT_INBOX item 8 made all eight
# modifier actions live here and retired that caption, so the assertion is
# INVERTED rather than deleted: the surface moved, and its guard moved with it.
#
# The literal subtitle, never the ALL-CAPS title: the caps are `textTransform`
# styling and the accessibility text keeps its original casing, so a selector
# written as "ACTIVE MODIFIERS" matches nothing.
- tapOn: "Cooked this week"
- assertNotVisible:
    id: "coach-note-actions-not-yet"
- takeScreenshot: artifacts/ui-walk/coach-my-status-expanded

# ── AND ONE OF THE FREED CONTROLS ACTUALLY OPENS ITS DOOR ──
#
# `Update status` is one of the SEVEN that were inert until 2026-08-12. A green
# id proves the button is in the tree; only tapping it proves the wiring behind
# it, and only the screenshot proves the sheet lands where a thumb can reach it.
# BY ID, NOT BY LABEL, AND THE REASON IS IN `ActiveModifiersSection`: every
# action Pressable sets `accessibilityLabel={actionTestID}`, so the button's
# accessible name IS its id and a selector written as the visible text
# ("Update status") matches nothing. The id is regex-matched because the
# readiness fact id is minted at write time.
- tapOn:
    id: "readiness-update-.*"
- extendedWaitUntil:
    visible: "How are you feeling now?"
    timeout: 10000
- takeScreenshot: artifacts/ui-walk/coach-my-status-action-live
- tapOn: "Cancel"
- assertVisible:
    id: "coach-status-screen"

# ── AND IT CLOSES BACK TO WEEK; COACH REMAINS CHAT-ONLY ──
- tapOn:
    id: "coach-status-close"
- assertNotVisible:
    id: "coach-status-screen"
- assertVisible:
    id: "program-screen"
- tapOn:
    id: "tab-coach"
- assertVisible:
    id: "coach-tab-conversation"
- assertNotVisible:
    id: "modifiers-strip-coach"

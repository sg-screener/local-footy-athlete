appId: com.localfootyathlete.app
name: Modifiers apply, show on Day and Week, survive restart, and clear from My Status
tags:
  - e2e
  - golden
  - my-status
---
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week
- assertNotVisible:
    id: modifiers-strip-day
- scrollUntilVisible:
    element:
      id: home-tired-entry
    direction: DOWN
- tapOn:
    id: home-tired-entry
- tapOn:
    id: readiness-option-cooked-week
- extendedWaitUntil:
    visible:
      id: home-week-readiness-confirmed-done
    timeout: 15000
- tapOn:
    id: home-week-readiness-confirmed-done
- scrollUntilVisible:
    element:
      id: modifiers-strip-day
    direction: UP
- assertVisible: "1 active modifier.*"
- tapOn:
    id: modifiers-strip-day
- assertVisible:
    id: coach-status-screen
- assertVisible: "1 ACTIVE"
- assertNotVisible:
    id: modifiers-sheet
- assertNotVisible: "Dismiss note"
- takeScreenshot: artifacts/ui-walk/modifier-active-status
- tapOn:
    id: coach-status-close
- tapOn:
    id: program-view-week
- assertVisible:
    id: modifiers-strip-week
- tapOn:
    id: modifiers-strip-week
- assertVisible: "1 ACTIVE"
- tapOn:
    id: coach-status-close
- runFlow:
    file: ../common/checkpoint-and-reload.yaml
    env:
      SEED_ID: standard-in-season-week
- tapOn:
    id: modifiers-strip-day-header
- assertVisible: "1 ACTIVE"
- tapOn:
    id: "coach-status-modifier-.*"
- tapOn: "I'm good now"
- tapOn: "Clear and update program"
- extendedWaitUntil:
    visible:
      id: coach-status-empty
    timeout: 15000
- assertVisible: "0 ACTIVE"
- tapOn:
    id: coach-status-close
- assertNotVisible:
    id: modifiers-strip-day
- tapOn:
    id: program-view-week
- assertNotVisible:
    id: modifiers-strip-week
- runFlow:
    file: ../common/checkpoint-and-reload.yaml
    env:
      SEED_ID: standard-in-season-week
- tapOn:
    id: modifiers-strip-day-header
- assertVisible:
    id: coach-status-empty
- takeScreenshot: artifacts/ui-walk/modifier-cleared-after-restart

appId: com.localfootyathlete.app
name: Golden - live Coach Snapshot dashboard
tags:
  - e2e
  - golden
  - coach
---
- extendedWaitUntil:
    visible:
      id: "e2e-seed-ready-coach-snapshot-populated-journey"
    timeout: 30000
- tapOn:
    id: "tab-coach"
- extendedWaitUntil:
    visible:
      id: "coach-dashboard"
    timeout: 15000
- assertVisible:
    id: "coach-dashboard-week"
- assertVisible:
    id: "coach-dashboard-load-track"
- assertVisible:
    id: "coach-dashboard-load-sweet-spot"
- assertVisible:
    id: "coach-dashboard-load-marker"
- assertVisible:
    id: "coach-dashboard-readiness"
- assertVisible:
    id: "coach-dashboard-load"
- assertVisible:
    id: "coach-dashboard-progress"
- assertVisible:
    id: "coach-dashboard-restrictions"
- assertVisible: "My Status"
- assertVisible: "No check-in today"
- assertVisible:
    id: "coach-tab-conversation"
- takeScreenshot: artifacts/ui-walk/coach-snapshot-dashboard

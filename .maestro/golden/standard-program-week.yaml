appId: com.localfootyathlete.app
name: Golden - deterministic standard program week
tags:
  - e2e
  - golden
  - program
---
# RE-AIMED AT THE DAY-FIRST SHAPE, 2026-08-10. This flow asserted seven full
# day rows on a screen that draws ONE. It was not testing a broken app; it was
# describing a screen that stopped existing on 2026-08-01, and it had not been
# run since 18 July, so nothing said so.
#
# IT NOW ASSERTS BOTH SHAPES, which is more than it used to claim, not less:
# the day the app opens on, and the seven the athlete zooms out to.
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week
- assertVisible:
    id: "program-week-previous"
- assertVisible:
    id: "program-week-current"
- assertVisible:
    id: "program-week-next"

# ── THE DAY SHAPE: one day at full size, and NO strip (ruling 3, 2026-08-10) ──
# The three `week-strip*` assertions here are INVERTED to one, not deleted: a
# removal Sam ruled needs a cell watching it, or a restored line brings it back
# unnoticed. `day-timeline` carries the day-shape-only property the strip had.
- assertNotVisible:
    id: "week-strip"
- assertVisible:
    id: "day-timeline"
- assertVisible:
    id: "day-row-mon"

# Reach the active-modifier coordinate by ACTING, never by seeding a hand-built
# store snapshot. A clean week has zero and correctly renders no line; that is
# why the first visual pass hid this part of the signed design entirely.
- scrollUntilVisible:
    element:
      id: "home-life-fact-chips"
    direction: DOWN
- tapOn:
    id: "equipment-preset-open"
- extendedWaitUntil:
    visible:
      id: "equipment-preset-barbell"
    timeout: 10000
- tapOn:
    id: "equipment-preset-barbell"
- tapOn: "Apply for this week"
- extendedWaitUntil:
    visible:
      id: "modifiers-strip-day"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "program-view-toggle"
    direction: UP

# ── THE WEEK SHAPE: all seven ──
- runFlow:
    file: ../common/show-week-shape.yaml
- assertVisible:
    id: "day-row-mon"
- assertVisible:
    id: "day-row-tue"
- assertVisible:
    id: "day-row-wed"
- assertVisible:
    id: "day-row-thu"
- assertVisible:
    id: "day-row-fri"
- assertVisible:
    id: "modifiers-strip-week"
- assertVisible: "1 active modifier impacting program"
- assertNotVisible:
    id: "day-timeline"

# ── RULING 7: ALL SEVEN USE HER CARD, INCLUDING TODAY ───────────────────────
# Sam answered the one remaining fork on 2026-08-11: her card design for all
# seven days. Monday is both TODAY and the row selected by the existing state,
# so these ids prove those two coordinates cannot turn it into the old hero row.
- assertVisible:
    id: "day-row-mon-card-header"
- assertVisible:
    id: "day-week-today-pill"
- assertVisible:
    id: "day-row-mon-count"
- assertNotVisible:
    id: "view-workout-button"
- assertNotVisible:
    id: "make-change-link"
- takeScreenshot: artifacts/ui-walk/week-prototype-parity

# A different card opens onto the SAME details while its card head stays put.
- assertVisible:
    id: "day-row-wed-count"
- tapOn:
    id: "day-row-wed"
- extendedWaitUntil:
    visible:
      id: "day-timeline"
    timeout: 10000
- assertVisible:
    id: "day-timeline-rows-strength"
- assertNotVisible:
    id: "day-timeline-part-strength"
- assertVisible:
    id: "day-row-wed-card-header"
- assertNotVisible:
    id: "view-workout-button"
- assertNotVisible:
    id: "make-change-link"
- takeScreenshot: artifacts/ui-walk/week-row-open

# The taller card structure still reaches the bottom of the same seven-day
# list. These checks come last so the scroll cannot make the card-head checks
# above answer a viewport question instead of a structure question.
- scrollUntilVisible:
    element:
      id: "day-row-sat"
    direction: DOWN
- assertVisible:
    id: "day-row-sat"
- scrollUntilVisible:
    element:
      id: "day-row-sun"
    direction: DOWN
- assertVisible:
    id: "day-row-sun"
- takeScreenshot: artifacts/ui-walk/week-status-cards

appId: com.localfootyathlete.app
name: Golden - deterministic standard program week
tags:
  - e2e
  - golden
  - program
---
# RE-AIMED AT THE DAY-FIRST SHAPE, 2026-08-10. This flow asserted seven full
# day rows on a screen that draws ONE. It was not testing a broken app; it was
# describing a screen that stopped existing on 2026-08-01, and it had not been
# run since 18 July, so nothing said so.
#
# IT NOW ASSERTS BOTH SHAPES, which is more than it used to claim, not less:
# the day the app opens on, and the seven the athlete zooms out to.
- runFlow:
    file: ../common/reset-seed.yaml
    env:
      SEED_ID: standard-in-season-week
- assertVisible:
    id: "program-week-previous"
- assertVisible:
    id: "program-week-current"
- assertVisible:
    id: "program-week-next"

# ── THE DAY SHAPE: one day at full size, and NO strip (ruling 3, 2026-08-10) ──
# The three `week-strip*` assertions here are INVERTED to one, not deleted: a
# removal Sam ruled needs a cell watching it, or a restored line brings it back
# unnoticed. `day-timeline` carries the day-shape-only property the strip had.
- assertNotVisible:
    id: "week-strip"
- assertVisible:
    id: "day-timeline"
- assertVisible:
    id: "day-row-mon"

# ── THE WEEK SHAPE: all seven ──
- runFlow:
    file: ../common/show-week-shape.yaml
- assertVisible:
    id: "day-row-mon"
- assertVisible:
    id: "day-row-tue"
- assertVisible:
    id: "day-row-wed"
- assertVisible:
    id: "day-row-thu"
- assertVisible:
    id: "day-row-fri"
- scrollUntilVisible:
    element:
      id: "day-row-sat"
    direction: DOWN
- assertVisible:
    id: "day-row-sat"
- scrollUntilVisible:
    element:
      id: "day-row-sun"
    direction: DOWN
- assertVisible:
    id: "day-row-sun"
